[project]
name = "jobfit-backend"
version = "0.1.0"
description = "JobFit backend: FastAPI API and static frontend server"
requires-python = ">=3.13"
dependencies = [
    "clerk-backend-api>=7.1.0",
    "fastapi>=0.162.4",
    "markdown>=3.11.3",
    "openai>=3.49.0",
    "uvicorn>=0.54.0",
    "weasyprint>=70.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-m 'not integration'"
markers = ["integration: calls the real OpenRouter API (needs OPENROUTER_API_KEY)"]
